name: Fabric Loom Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified base and apply Phase 17/18/19/20/21 corrections
        shell: bash
        run: |
          cat ci-bundle/minpart_*.b64 | base64 --decode > phase16-minimal.tar.gz
          echo "6ede31306a3e275256b657e37bc88eff030932143b576b6fd0b83689616cb9be  phase16-minimal.tar.gz" | sha256sum --check --strict
          tar -xzf phase16-minimal.tar.gz
          test -f build.gradle
          test -d src/main/java

          sed -i 's/RepositoriesMode.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/' settings.gradle
          sed -i "s/id 'fabric-loom' version '1.11-SNAPSHOT'/id 'fabric-loom' version '1.13-SNAPSHOT'/" build.gradle
          sed -i "s/version = '0.8.0-phase16-ci'/version = '0.8.5-phase21-pnxfix'/" build.gradle

          cp ci-overlays/phase17/RaidBattleType.java src/main/java/com/cobbleraids/battle/RaidBattleType.java
          cp ci-overlays/phase17/ShowdownResourceLoaderMixin.java src/main/java/com/cobbleraids/showdown/ShowdownResourceLoaderMixin.java
          mkdir -p src/main/java/com/cobbleraids/command
          cp ci-overlays/phase18/RaidAdminBossOps.java src/main/java/com/cobbleraids/command/
          cp ci-overlays/phase18/RaidAdminDebugOps.java src/main/java/com/cobbleraids/command/
          cp ci-overlays/phase18/CobbleRaids.java src/main/java/com/cobbleraids/CobbleRaids.java
          cp ci-overlays/phase20/RaidAdminCommand.java src/main/java/com/cobbleraids/command/RaidAdminCommand.java
          cp ci-overlays/phase20/RaidAdminSpawnOps.java src/main/java/com/cobbleraids/command/RaidAdminSpawnOps.java
          cp ci-overlays/phase20/RaidBossSpawner.java src/main/java/com/cobbleraids/spawn/RaidBossSpawner.java
          cp ci-overlays/phase21/raid-patch.js src/main/resources/assets/cobbleraids/showdown/raid-patch.js

          python - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/com/cobbleraids/lobby/RaidLobbyManager.java')
          s=p.read_text()
          needle='    public static RaidLobby get(PokemonEntity boss) { return boss == null ? null : BY_BOSS.get(boss.getUUID()); }\n'
          insert='''    /** Snapshot used by admin/debug commands; lobby mutation remains server-thread owned. */\n    public static List<RaidLobby> all() { return List.copyOf(BY_BOSS.values()); }\n\n    /** Cancels and forgets recruitment for a boss before an administrative despawn. */\n    public static boolean cancelForBoss(PokemonEntity boss) {\n        if (boss == null) return false;\n        RaidLobby lobby = BY_BOSS.remove(boss.getUUID());\n        if (lobby == null) return false;\n        lobby.cancel();\n        return true;\n    }\n\n'''
          if needle not in s:
              raise SystemExit('RaidLobbyManager insertion point changed; refusing blind patch')
          p.write_text(s.replace(needle, insert + needle))
          PY

          # Phase 19 runtime fix: isolate mixins from normal CobbleRaids classes.
          mkdir -p src/main/java/com/cobbleraids/mixin/battle src/main/java/com/cobbleraids/mixin/showdown
          for name in RaidBattleRegistryMixin RaidBattleSelectActionsMixin RaidPlayerBattleActorMixin RaidPokemonBattleMixin; do
            sed 's/^package com\.cobbleraids\.battle;/package com.cobbleraids.mixin.battle;/' \
              "src/main/java/com/cobbleraids/battle/${name}.java" \
              > "src/main/java/com/cobbleraids/mixin/battle/${name}.java"
            rm "src/main/java/com/cobbleraids/battle/${name}.java"
          done
          sed 's/^package com\.cobbleraids\.showdown;/package com.cobbleraids.mixin.showdown;/' \
            src/main/java/com/cobbleraids/showdown/ShowdownResourceLoaderMixin.java \
            > src/main/java/com/cobbleraids/mixin/showdown/ShowdownResourceLoaderMixin.java
          rm src/main/java/com/cobbleraids/showdown/ShowdownResourceLoaderMixin.java
          sed -i 's/"package": "com.cobbleraids"/"package": "com.cobbleraids.mixin"/' \
            src/main/resources/mixins/cobbleraids.mixins.json

          grep "0.8.5-phase21-pnxfix" build.gradle
          grep 'Commands.argument("pokemon", StringArgumentType.word())' src/main/java/com/cobbleraids/command/RaidAdminCommand.java
          grep 'definition.species().getPath().equalsIgnoreCase(pokemonName)' src/main/java/com/cobbleraids/command/RaidAdminSpawnOps.java
          grep 'PokemonSpecies.getByName(definition.species().getPath())' src/main/java/com/cobbleraids/spawn/RaidBossSpawner.java
          ! grep -q 'PokemonSpecies.getByName(definition.species().toString())' src/main/java/com/cobbleraids/spawn/RaidBossSpawner.java
          grep 'const oldGetSlot = Pokemon.prototype.getSlot;' src/main/resources/assets/cobbleraids/showdown/raid-patch.js
          grep "const letter = 'abcdef'.charAt(this.side.n);" src/main/resources/assets/cobbleraids/showdown/raid-patch.js
          grep 'if (isBossSide(this.side)) return `${this.side.id}a`;' src/main/resources/assets/cobbleraids/showdown/raid-patch.js
          grep 'RaidLifecycleCoordinator.abort' src/main/java/com/cobbleraids/command/RaidAdminBossOps.java
          grep 'ContributionMath.percentages' src/main/java/com/cobbleraids/command/RaidAdminDebugOps.java
          grep 'cancelForBoss' src/main/java/com/cobbleraids/lobby/RaidLobbyManager.java
          grep '"package": "com.cobbleraids.mixin"' src/main/resources/mixins/cobbleraids.mixins.json
          test -z "$(find src/main/java/com/cobbleraids -path '*/mixin/*' -prune -o -name '*Mixin.java' -print)"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compile and remap
        run: gradle --no-daemon clean build --stacktrace --warning-mode all

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobbleraids-phase21-build
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
