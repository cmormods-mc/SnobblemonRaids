name: Fabric Loom Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Validate Phase 31 source and resources
        run: validation/validate_phase31.sh

      - name: Compile and remap
        run: gradle --no-daemon clean build --stacktrace --warning-mode all

      - name: Validate runtime JAR
        run: >-
          python3 validation/validate_phase31.py
          build/libs/CobbleRaids-0.8.15-phase31-spawn-director.jar

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobbleraids-phase31-build
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
