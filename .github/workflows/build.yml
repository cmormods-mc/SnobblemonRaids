name: Fabric Loom Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified Phase 16 project
        shell: bash
        run: |
          cat ci-bundle/minpart_*.b64 | base64 --decode > phase16-minimal.tar.gz
          echo "6ede31306a3e275256b657e37bc88eff030932143b576b6fd0b83689616cb9be  phase16-minimal.tar.gz" | sha256sum --check --strict
          tar -xzf phase16-minimal.tar.gz
          test -f build.gradle
          test -d src/main/java

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compile and remap
        run: gradle --no-daemon clean build --stacktrace --warning-mode all

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobbleraids-build
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
