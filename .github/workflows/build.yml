name: Fabric Loom Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Validate core source and resources
        run: validation/validate_phase31.sh

      - name: Validate raid boss lifecycle and healing integrity
        run: python3 validation/validate_phase32.py

      - name: Validate reward visibility and SkiesGUIs optionality
        run: python3 validation/validate_phase36.py

      - name: Validate native reward reveal screen
        run: python3 validation/validate_phase37.py

      - name: Compile and remap
        run: gradle --no-daemon clean build --stacktrace --warning-mode all

      - name: Validate runtime JAR
        # Derived from build.gradle so a version bump cannot silently skip JAR validation.
        run: |
          version=$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)
          jar="build/libs/CobbleRaids-${version}.jar"
          test -f "$jar" || { echo "missing $jar"; ls -la build/libs; exit 1; }
          python3 validation/validate_phase31.py "$jar"
          python3 validation/validate_phase32.py "$jar"
          python3 validation/validate_phase36.py "$jar"
          python3 validation/validate_phase37.py "$jar"

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobbleraids-build
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
