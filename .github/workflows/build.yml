name: Fabric Loom Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified Phase 16 base + apply reviewed Phase 17 delta
        shell: bash
        run: |
          cat ci-bundle/minpart_*.b64 | base64 --decode > phase16-minimal.tar.gz
          echo "6ede31306a3e275256b657e37bc88eff030932143b576b6fd0b83689616cb9be  phase16-minimal.tar.gz" | sha256sum --check --strict
          tar -xzf phase16-minimal.tar.gz
          test -f build.gradle
          test -d src/main/java

          # Compiler-discovered build corrections from the successful Phase 16 CI pass.
          sed -i 's/RepositoriesMode.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/' settings.gradle
          sed -i "s/id 'fabric-loom' version '1.11-SNAPSHOT'/id 'fabric-loom' version '1.13-SNAPSHOT'/" build.gradle
          sed -i "s/version = '0.8.0-phase16'/version = '0.8.1-phase17-runtime'/" build.gradle
          sed -i 's/import net.minecraft.network.chat.Component;/import net.minecraft.network.chat.Component;\nimport net.minecraft.network.chat.MutableComponent;/' src/main/java/com/cobbleraids/battle/RaidBattleType.java
          sed -i 's/@Override public Component getDisplayName()/@Override public MutableComponent getDisplayName()/' src/main/java/com/cobbleraids/battle/RaidBattleType.java

          # Runtime correction: tolerate harmless index.js edits by other Showdown-integrating addons
          # while still failing closed unless the file has Cobblemon's expected Graal entry-point structure.
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/com/cobbleraids/showdown/ShowdownResourceLoaderMixin.java')
          s=p.read_text()
          s=s.replace(
              '    private static final String INDEX_BATTLE_STREAM_173 = "const BS = require(\'./sim/battle-stream\');";\n',
              '    private static final String INDEX_BATTLE_STREAM_MODULE = "./sim/battle-stream";\n'
              '    private static final String INDEX_START_BATTLE = "function startBattle(";\n'
              '    private static final String INDEX_SEND_BATTLE_MESSAGE = "function sendBattleMessage(";\n'
          )
          old='''    private static void patchIndexBootstrap(Path path) {\n        try {\n            String source = Files.readString(path, StandardCharsets.UTF_8);\n            if (source.contains(INDEX_RAID_HOOK)) return;\n            int first = source.indexOf(INDEX_BATTLE_STREAM_173);\n            int second = first < 0 ? -1 : source.indexOf(INDEX_BATTLE_STREAM_173, first + 1);\n            if (first < 0 || second >= 0) {\n                throw new IllegalStateException("Cobblemon Showdown index.js bootstrap signature changed; refusing to patch blindly");\n            }\n            String replacement = INDEX_BATTLE_STREAM_173 + System.lineSeparator() + INDEX_RAID_HOOK;\n            Files.writeString(path, source.replace(INDEX_BATTLE_STREAM_173, replacement), StandardCharsets.UTF_8);\n        } catch (IOException e) {\n            throw new IllegalStateException("Failed to install CobbleRaids Showdown bootstrap hook", e);\n        }\n    }\n'''
          new='''    private static void patchIndexBootstrap(Path path) {\n        try {\n            String source = Files.readString(path, StandardCharsets.UTF_8);\n            if (source.contains(INDEX_RAID_HOOK)) return;\n\n            // Do not depend on one exact import statement. Other Cobblemon addons may make\n            // harmless edits to index.js while retaining the same Graal entry-point surface.\n            // We still fail closed if this is not recognizably Cobblemon's Showdown bootstrap.\n            boolean hasBattleStream = source.contains(INDEX_BATTLE_STREAM_MODULE);\n            boolean hasStartBattle = source.contains(INDEX_START_BATTLE);\n            boolean hasSendBattleMessage = source.contains(INDEX_SEND_BATTLE_MESSAGE);\n            if (!hasBattleStream || !hasStartBattle || !hasSendBattleMessage) {\n                throw new IllegalStateException(\n                        "Cobblemon Showdown index.js structure is incompatible; refusing to install raid hook");\n            }\n\n            String separator = source.endsWith("\\n") || source.endsWith("\\r") ? "" : System.lineSeparator();\n            Files.writeString(\n                    path,\n                    source + separator + INDEX_RAID_HOOK + System.lineSeparator(),\n                    StandardCharsets.UTF_8);\n        } catch (IOException e) {\n            throw new IllegalStateException("Failed to install CobbleRaids Showdown bootstrap hook", e);\n        }\n    }\n'''
          if old not in s:
              raise SystemExit('Phase 17 target method not found; refusing blind CI patch')
          p.write_text(s.replace(old,new))
          PY

          grep 'PREFER_PROJECT' settings.gradle
          grep "fabric-loom.*1.13-SNAPSHOT" build.gradle
          grep "0.8.1-phase17-runtime" build.gradle
          grep 'MutableComponent getDisplayName' src/main/java/com/cobbleraids/battle/RaidBattleType.java
          grep 'INDEX_START_BATTLE' src/main/java/com/cobbleraids/showdown/ShowdownResourceLoaderMixin.java
          grep 'source + separator + INDEX_RAID_HOOK' src/main/java/com/cobbleraids/showdown/ShowdownResourceLoaderMixin.java

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compile and remap
        run: gradle --no-daemon clean build --stacktrace --warning-mode all

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobbleraids-phase17-build
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
