<!doctype html>
<meta charset="utf-8">
<title>Trophy Room</title>
<link rel="stylesheet" href="trophy.css">
<div id="stage">
  <div class="txt" id="title">Trophy Room</div>
  <div class="txt c" id="subtitle">HALL OF VICTORIES</div>
  <div class="txt" id="brand">COBBLEMON RAID NETWORK</div>
  <input id="search" type="text" maxlength="64" placeholder="Search species..." autocomplete="off" spellcheck="false">
  <button class="plate" id="tier"></button>
  <button class="plate" id="shiny"></button>
  <button class="plate" id="sort"></button>
  <div id="cases"></div>
  <div id="thumbs"></div>
  <div class="txt" id="counts"></div>
  <div class="txt c" id="pager"></div>
  <button class="plate" id="prev">&lt; Previous</button>
  <button class="plate" id="next">Next &gt;</button>
  <button class="plate" id="back">Back</button>
</div>
<div id="tip" hidden></div>
<script src="trophy.js"></script>
