<!doctype html>
<meta charset="utf-8">
<title>Trophy Room</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="trophy.css">
<div class="stage">
  <header class="top">
    <b class="title">TROPHY ROOM</b><span class="crumb" id="crumb"></span><i class="sp"></i>
    <button class="btn ghost" id="close">Close</button>
  </header>
  <div id="filters">
    <input class="field" id="search" type="text" maxlength="64" placeholder="Search species..." autocomplete="off" spellcheck="false">
    <button class="btn ghost" id="tier"></button>
    <button class="btn ghost" id="shiny"></button>
    <button class="btn ghost" id="sort"></button>
  </div>
  <main id="cases"></main>
  <footer id="pager">
    <button class="btn ghost" id="prev">&lsaquo; Previous</button>
    <span id="where"></span>
    <button class="btn ghost" id="next">Next &rsaquo;</button>
  </footer>
</div>
<script src="../shared/ui.js"></script>
<script src="trophy.js"></script>
