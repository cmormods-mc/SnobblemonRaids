plugins {
    id 'fabric-loom' version '1.13.6'
}

version = '0.8.85-shop-species-icons'
group = 'com.cobbleraids'

base {
    archivesName = 'CobbleRaids'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()

    modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'

    // Exact public releases used by the live-tested runtime builds.
    modImplementation 'maven.modrinth:MdwFAVRL:kF7CvxTo' // Cobblemon 1.7.3
    modImplementation 'maven.modrinth:eTmjDQ2A:azTJ3S8C' // SkiesGUIs 1.8.1
    // Compile-only: the %cobbleraids:points% token is published when this is installed and
    // skipped when it is not, so it must never be pulled in as a hard dependency.
    modCompileOnly 'maven.modrinth:eXts2L7r:U5bhVym2' // Text Placeholder API 2.4.2+1.21

    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/**
 * Covers the parts of CobbleRaids that are deliberately free of Minecraft, Cobblemon and Fabric
 * types -- spawn-rate maths, contribution maths, config validation, and the Showdown file patcher.
 * Those are also where a regression is silent rather than loud: a mispatched simulator produces
 * invulnerable bosses with a clean log, and a spawn-weight change produces a wrong rate nobody can
 * see. Verifying them here takes a second instead of a jar build plus a modded server boot.
 */
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

sourceSets {
    biomeCompat {
        resources.srcDir 'compat/biome/src/main/resources'
    }
    addonRewards {
        resources.srcDir 'compat/addonrewards/src/main/resources'
    }
}

tasks.register('biomeCompatJar', Jar) {
    group = 'build'
    description = 'Builds the optional tag-based biome compatibility data mod.'
    dependsOn tasks.named('processBiomeCompatResources')
    archiveBaseName = 'CobbleRaids-BiomeCompat'
    archiveVersion = '1.0.0'
    archiveClassifier = ''
    from sourceSets.biomeCompat.output
}

tasks.register('addonRewardsJar', Jar) {
    group = 'build'
    description = 'Builds the optional raid-reward loot tables for common Cobblemon add-ons.'
    dependsOn tasks.named('processAddonRewardsResources')
    archiveBaseName = 'CobbleRaids-AddonRewards'
    // 2.0.0 because the contents changed wholesale: the four cobbleraids:tier bundles and the
    // vitamins leaf are gone, and the policy economy's base/general/specialty graph replaced them.
    // Shipping that under the old filename would leave two jars nobody can tell apart, which is
    // the same trap identically named core builds caused.
    //
    // 2.1.0-curated-base: the base catalog was rebuilt. Ten rows of Poke Balls and Potions became
    // forty-five rows of balls, EV items, upgraded medicine and held items, and base's share of a
    // bundle fell from 58-73% to 39-50%. The graph shape is unchanged, so this is a minor bump --
    // but the payouts are not comparable, which is why the filename has to differ.
    //
    // 2.2.0-no-filler: the capsule-materials, safari and riding leaves are gone -- two, two and one
    // entry respectively, and between them 40-54% of every general selection. General is now base
    // plus card packs. Also drops eight dead addons/* tables the 2.0.0 rebuild left behind.
    //
    // 2.3.0-key-fragments: adds keys/<tier>, the one-outcome tables the reward policy points at
    // for guaranteed raid key fragments.
    archiveVersion = '2.3.0-key-fragments'
    archiveClassifier = ''
    from sourceSets.addonRewards.output
}

tasks.named('build') {
    dependsOn tasks.named('biomeCompatJar')
    dependsOn tasks.named('addonRewardsJar')
}
